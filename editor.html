<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ویرایشگر فایل</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--tg-theme-bg-color, #1e1e1e);
      color: var(--tg-theme-text-color, #d4d4d4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 16px;
      background-color: var(--tg-theme-secondary-bg-color, #252526);
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    #file-path {
      font-family: monospace;
      color: #9cdcfe;
      direction: ltr;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
    }
    #status {
      font-size: 11px;
      color: #888;
    }
    #editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      position: relative;
    }
    textarea {
      flex: 1;
      width: 100%;
      background: transparent;
      color: inherit;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      line-height: 1.6;
      font-family: Consolas, Monaco, "Courier New", monospace;
      direction: auto;
      text-align: left;
    }
    #loader {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(30, 30, 30, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #444;
      border-top: 3px solid #007acc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    footer {
      padding: 12px 16px;
      background-color: var(--tg-theme-secondary-bg-color, #252526);
      border-top: 1px solid #333;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: var(--tg-theme-button-color, #0e639c);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <div id="file-path">بارگذاری...</div>
    <div id="status">در حال اتصال...</div>
  </header>

  <div id="editor-container">
    <div id="loader">
      <div class="spinner"></div>
      <span id="loader-text">در حال بارگذاری فایل...</span>
    </div>
    <textarea id="content" placeholder="محتوای فایل در اینجا نمایش داده می‌شود..." disabled></textarea>
  </div>

  <footer>
    <button id="save-btn" onclick="saveFile()" disabled>
      <span>💾 ذخیره تغییرات (Commit)</span>
    </button>
  </footer>

  <script>
    // آدرس‌های وب‌هوک n8n شما
    const N8N_GET_URL = "https://ah-fadaei.app.n8n.cloud/webhook/get-file-content";
    const N8N_SAVE_URL = "https://ah-fadaei.app.n8n.cloud/webhook/save-edited-file";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    // پشتیبانی همزمان از path یا file و همچنین chatId
    const filePath = urlParams.get('path') || urlParams.get('file');
    const chatId = urlParams.get('chat_id') || urlParams.get('chatId') || tg?.initDataUnsafe?.user?.id || '';

    const filePathEl = document.getElementById('file-path');
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const loaderEl = document.getElementById('loader');
    const loaderTextEl = document.getElementById('loader-text');
    const saveBtn = document.getElementById('save-btn');

    async function loadContent() {
      if (!filePath) {
        loaderTextEl.innerText = "❌ مسیر فایل مشخص نشده است!";
        document.querySelector('.spinner').style.display = 'none';
        return;
      }

      filePathEl.innerText = filePath;
      statusEl.innerText = "دریافت فایل...";

      try {
        const response = await fetch(`${N8N_GET_URL}?path=${encodeURIComponent(filePath)}&file=${encodeURIComponent(filePath)}`);
        if (!response.ok) throw new Error("HTTP error " + response.status);
        
        const data = await response.json();
        
        contentEl.value = (typeof data === 'string') ? data : (data.content || data.fileContent || JSON.stringify(data, null, 2));
        contentEl.disabled = false;
        saveBtn.disabled = false;
        loaderEl.style.display = 'none';
        statusEl.innerText = "آماده ویرایش";
      } catch (err) {
        console.error(err);
        loaderTextEl.innerText = "❌ خطا در دریافت فایل از n8n!";
        document.querySelector('.spinner').style.display = 'none';
        statusEl.innerText = "خطا";
      }
    }

    async function saveFile() {
      saveBtn.disabled = true;
      saveBtn.innerHTML = "<span>⏳ در حال ذخیره...</span>";
      statusEl.innerText = "در حال ارسال به GitHub...";

      try {
        const payload = {
          filePath: filePath,
          content: contentEl.value,
          chatId: chatId
        };

        const response = await fetch(N8N_SAVE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error("Save error " + response.status);

        statusEl.innerText = "ذخیره شد ✅";
        if (tg) {
          tg.close();
        } else {
          alert("تغییرات با موفقیت ذخیره شد!");
        }
      } catch (err) {
        console.error(err);
        alert("خطا در ذخیره تغییرات!");
        saveBtn.disabled = false;
        saveBtn.innerHTML = "<span>💾 ذخیره تغییرات (Commit)</span>";
        statusEl.innerText = "خطا در ذخیره";
      }
    }

    loadContent();
  </script>
</body>
</html>
