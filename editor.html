<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Obsidian Markdown Editor</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #7c3aed;
      --accent-hover: #6d28d9;
      --border-color: #333333;
      --header-bg: #18181b;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--header-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .file-info {
      font-size: 13px;
      color: #a1a1aa;
      direction: ltr;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65%;
    }

    .status-badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #27272a;
      color: #a1a1aa;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    textarea {
      flex: 1;
      width: 100%;
      background-color: var(--card-bg);
      color: #f4f4f5;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      line-height: 1.6;
      resize: none;
      outline: none;
      direction: auto;
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace, sans-serif;
    }

    textarea:focus {
      border-color: var(--accent-color);
    }

    footer {
      padding: 12px 16px;
      background-color: var(--header-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(18, 18, 18, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #333;
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loader" class="loading-overlay">
    <div class="spinner"></div>
    <span id="loading-text" style="font-size: 14px; color: #a1a1aa;">در حال بارگذاری فایل...</span>
  </div>

  <header>
    <div class="file-info" id="filePathLabel">Loading...</div>
    <div class="status-badge" id="statusBadge">آماده</div>
  </header>

  <div class="editor-container">
    <textarea id="fileContent" placeholder="محتوای فایل در اینجا نمایش داده می‌شود..."></textarea>
  </div>

  <footer>
    <button id="saveBtn" onclick="saveFile()">
      <span>💾 ذخیره تغییرات (Commit)</span>
    </button>
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // آدرس وب‌هوک‌های n8n (دامنه/آدرس n8n خودت را جایگزین کن)
    const N8N_GET_URL = "https://ah-fadaei.app.n8n.cloud/webhook/get-file-content";
    const N8N_SAVE_URL = "https://ah-fadaei.app.n8n.cloud/webhook/save-edited-file";

    const urlParams = new URLSearchParams(window.location.search);
    const filePath = urlParams.get('path') || '';
    const chatId = urlParams.get('chat_id') || '';

    document.getElementById('filePathLabel').innerText = filePath || 'مسیر فایل نامشخص';

    let fileSha = '';

    // دریافت محتوای فعلی فایل از n8n
    async function loadFileContent() {
      if (!filePath) {
        alert('مسیر فایل ارسال نشده است!');
        document.getElementById('loader').style.display = 'none';
        return;
      }

      try {
        const res = await fetch(`${N8N_GET_URL}?path=${encodeURIComponent(filePath)}&chat_id=${chatId}`);
        const data = await res.json();

        if (data && data.content !== undefined) {
          document.getElementById('fileContent').value = data.content;
          fileSha = data.sha || '';
          document.getElementById('loader').style.display = 'none';
        } else {
          throw new Error('فایل یافت نشد یا خالی است');
        }
      } catch (err) {
        console.error(err);
        document.getElementById('loading-text').innerText = 'خطا در دریافت فایل یا وب‌هوک هنوز ست نشده.';
      }
    }

    // ذخیره محتوای جدید فایل
    async function saveFile() {
      const saveBtn = document.getElementById('saveBtn');
      const content = document.getElementById('fileContent').value;

      saveBtn.disabled = true;
      saveBtn.innerText = 'در حال ذخیره...';

      try {
        const res = await fetch(N8N_SAVE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            filePath: filePath,
            chatId: chatId,
            content: content,
            sha: fileSha
          })
        });

        if (res.ok) {
          if (tg) {
            tg.showPopup({
              title: "موفق",
              message: "تغییرات با موفقیت در گیت‌هاب ذخیره شد!",
              buttons: [{ type: "ok" }]
            }, () => {
              tg.close();
            });
          } else {
            alert('تغییرات با موفقیت ذخیره شد!');
          }
        } else {
          throw new Error('خطا در ذخیره فایل');
        }
      } catch (err) {
        alert('خطا در ارتباط با سرور یا ذخیره در گیت‌هاب');
        saveBtn.disabled = false;
        saveBtn.innerText = '💾 ذخیره تغییرات (Commit)';
      }
    }

    // لود اولیه
    window.onload = loadFileContent;
  </script>
</body>
</html>
